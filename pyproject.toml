[project]
name = "mainspring"
version = "1.13.0"
description = "Interactive viewer and Python reader for UIMF ion mobility mass spectrometry files."
readme = "README.md"
requires-python = "==3.12.*"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
# The reader alone. Qt is the `viewer` extra's, so a pipeline that installs mainspring
# for `mainspring.uimf` gets no graphical stack on its machine (lab record, task 35);
# `tools/check_public.py` pins both lists and installs the bare wheel to prove it.
# Floors, not this checkout's series: a caller with its own lock installs the reader
# beside it, and `uv.lock` keeps the viewer, the exe and the suite exact. Each floor is
# the oldest version the reader passes on, found by test (lab record, task 39): numpy 2.0
# makes an out-of-range intensity an OverflowError in the encoder rather than a silent
# wrap, and scipy 1.13 is the first built for numpy 2. `check_public.py` installs the
# wheel at exactly these, so change them only with that check passing.
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
# numba compiles the LZF + run-length decode; without it the pure-Python
# fallback runs, correct but 10-50x slower. The viewer installs it; a pipeline
# that only needs the reader may leave it out.
fast = ["numba~=0.67.0"]
# The viewer, which never runs without `fast`: a heat map redrawn on every wheel tick
# cannot wait on the pure-Python decode. Naming the extra keeps numba's pin in one place.
viewer = [
    "mainspring[fast]",
    "PySide6~=6.11.2",
    "pyqtgraph~=0.14.0",
]

[project.scripts]
mainspring = "mainspring.viewer.app:main"
uimf-info = "mainspring.uimf.cli:main"

[project.urls]
Repository = "https://github.com/bushgroup/mainspring"
Documentation = "https://github.com/bushgroup/mainspring/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Records the commit the artefact was built from, as a generated mainspring/_commit.py
# (hatch_build.py). Applies to every target: uv builds the wheel from the sdist, so the
# sdist has to carry it too. Nothing here derives a version.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/mainspring"]

[tool.uv]
package = true

[dependency-groups]
# `uv sync` installs this group by default, and through it the viewer: `uv run mainspring`,
# the suite and the PyInstaller build all need Qt, and a checkout should not have to ask.
dev = [
    "mainspring[viewer]",
    "pytest~=9.1",
    "pytest-qt~=4.5",
    "pyinstaller~=6.22",
    "pyinstaller-hooks-contrib~=2026.7",
]
